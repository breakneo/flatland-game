<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>平面国：正方形的迷雾救赎</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div class="mobile-frame" id="game-frame">
    <!-- 顶部信息栏 8% -->
    <header class="header-bar">
      <div class="character-identity">
        <span class="square-badge" id="square-badge">■</span>
        <span class="identity-text" id="identity-text">序幕 · 直线国之梦</span>
      </div>
      <div class="header-right-tools">
        <div class="oracle-gauge-wrapper" id="oracle-gauge-wrapper">
          <span id="gauge-label">危机:</span>
          <div class="mercury-tube">
            <div class="mercury-level" id="mercury-bar"></div>
          </div>
        </div>
        <button id="btn-level-toggle" class="btn-quick-reset" title="切换关卡">幕次</button>
        <button id="btn-quick-reset" class="btn-quick-reset" title="重新开始本幕试炼">重置</button>
      </div>
    </header>

    <!-- 上半部 35%：全知神谕沙盘 -->
    <div class="viewport-panel omni-viewport" id="omni-viewport">
      <div class="panel-tag" id="omni-panel-tag">全知沙盘 · 单一直线世界剖面</div>
      <canvas id="omni-canvas" width="440" height="300"></canvas>
    </div>

    <!-- 中部 5%：维多利亚手稿独白条 -->
    <div class="dialogue-strip" id="dialogue-strip">
      “你在梦中降落在一维线之国。前后皆被封死，何处容身？”
    </div>

    <!-- 下半部 35%：肉身迷雾受限视界 -->
    <div class="viewport-panel subj-viewport" id="subj-viewport">
      <div class="panel-tag" id="subj-panel-tag">肉身感官 · 纯一维中心视网膜</div>
      <canvas id="subj-canvas" width="440" height="290"></canvas>
    </div>

    <!-- 底部操作区 14% -->
    <footer class="controls-dock">
      <div class="d-pad">
        <button id="btn-up" class="btn-up">▲</button>
        <button id="btn-left" class="btn-left">◀</button>
        <button id="btn-down" class="btn-down">▼</button>
        <button id="btn-right" class="btn-right">▶</button>
      </div>

      <!-- 三维空间国高程调控台 (Altitude Dock) -->
      <div class="altitude-dock" id="altitude-dock" style="display: none;">
        <div class="altitude-title" id="altitude-title">高程: 0.0</div>
        <div class="altitude-btn-group">
          <button id="btn-elev-up" class="btn-elev" title="升至更高三维海拔 (键盘 E 或滚轮向上)">▲ 升高 (E)</button>
          <button id="btn-elev-down" class="btn-elev" title="降至近地三维海拔 (键盘 Q 或滚轮向下)">▼ 降低 (Q)</button>
        </div>
      </div>

      <button id="btn-ascend" class="btn-ascend btn-sealed">
        <span id="btn-ascend-text">心智冥思中</span>
        <small id="btn-ascend-sub" style="font-size: 0.68rem; font-weight: normal;">(待神谕启示)</small>
      </button>
    </footer>

    <!-- 结算手稿弹窗 -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="manuscript-card">
        <div class="manuscript-title" id="modal-title">手稿结算</div>
        <div class="manuscript-body" id="modal-body"></div>
        <button class="btn-restart" id="btn-modal-action">再启轮回</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
